<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 80%;
            margin: auto;
        }

        .profile {
            text-align: center;
            padding: 20px;
        }

        .profile img {
            width: 150px;
            border-radius: 50%;
        }

        .section {
            background: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid div {
            background: #ddd;
            padding: 30px;
            text-align: center;
        }

        /* Contact */
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        button {
            padding: 10px;
            background: #333;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Personal Website</h1>
    </header>

    <div class="container">
        <div class="profile">
            <img src="mu logo.png" alt="Profile Picture">
            <h2>SHASHIDHAR Y R</h2>
            <p>Web Developer | Student</p>
        </div>

        <div class="section">
            <h2>About Me</h2>
            <p>
                I am a student learning web development. I have basic knowledge of HTML, CSS, JavaScript, and PHP.
            </p>
        </div>

        <div class="section">
            <h2>My Work</h2>
            <div class="grid">
                <div>Project 1</div>
                <div>Project 2</div>
                <div>Project 3</div>
                <div>Project 4</div>
                <div>Project 5</div>
                <div>Project 6</div>
            </div>
        </div>

        <div class="section">
            <h2>Contact Me</h2>
            <form onsubmit="return validateForm()">
                <input type="text" id="name" placeholder="Your Name">
                <input type="email" id="email" placeholder="Your Email">
                <textarea id="msg" placeholder="Message"></textarea>
                <button type="submit">Send</button>
            </form>
        </div>

        <div class="section">
            <h2>My Location</h2>
            <iframe 
                src="https://maps.google.com/maps?q=hyderabad&t=&z=13&ie=UTF8&iwloc=&output=embed" 
                width="100%" height="300">
            </iframe>
        </div>
    </div>

    <script>
    function validateForm() {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let msg = document.getElementById("msg").value;

        if (name === "" || email === "" || msg === "") {
            alert("All fields are required!");
            return false;
        }

        alert("Message Sent Successfully!");
        return true;
    }
    </script>

</body>
</html>
