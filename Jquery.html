<!DOCTYPE html>
<html lang = "en">

    <body>
        <script src="jquery.js"></script>
        <h1 id = "id_msg"> Welcome, Guest!! </h1>
        <button id = "id_button"> Change Name </button>
        <script>
            $("#id_button").click (()=>{
                let proceed = confirm ("Want to change username ?");
                if (proceed) {
                    let user = prompt ("Enter user name:");

                    if (user && user.trim().length !==0){
                        $("#id_msg").text ("Welcome, " + user);
                        $("#id_button").css ("color", "blue");
                    }
                }
            });
        </script>
    </body>
</html>
