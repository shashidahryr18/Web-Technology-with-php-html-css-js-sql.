<script>
const arr = [1,2,3];
arr.push(4);
// Traverse in Array
for (let i = 0; i < arr.length; i++) {
  console.log(`value at index ${i} is ${arr[i]}`);
}
// Find Max value
const newArray = [10,20,1001,3];
let max = newArray[0];
for (let val of newArray) {
  max = max < val ? val : max;
}
console.log(max);
</script>
